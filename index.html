<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500&display=swap" rel="stylesheet">
    <title>Interactive Card</title>
</head>

<body>
    <div class="container">
        <div class="content">
            <!--Card Section-->
            <div class="card-section">
                <picture>
                    <source media="(max-width: 768px)" srcset="styles/images/bg-main-mobile.png">
                    <img src="styles/images/bg-main-desktop.png" alt="">
                </picture>
                <div class="card">
                    <div class="card-front-wrapper">
                        <img class="card-front" src="styles/images/bg-card-front.png" alt="front side card">
                        <div class="card-front-data">
                            <img src="styles/images/card-logo.svg" alt="Card logo" class="card-logo">
                            <span class="card-number">0000 0000 0000 0000</span>
                            <span class="card-name">JANE APPLESEED</span>
                            <span class="card-expiration">00/00</span>
                        </div>
                    </div>

                    <div class="card-back-wrapper">
                        <img class="card-back" src="styles/images/bg-card-back.png" alt="back side card">
                        <div class="card-back-data">
                            <span class="card-cvc">000</span>
                        </div>
                    </div>

                </div>
            </div>
            <!--Form Section-->
            <div class="form-content">
                <div class="form-section">
                    <div class="cardholder_name">
                        <label for="cardholder-name">CARDHOLDER NAME</label>
                        <input type="text" id="cardholder-name" placeholder="e.g. Jane Appleseed">
                        <p class="error-message" id="cardholder-error"></p>
                    </div>
                    <div class="card_number">
                        <label for="card-number">CARD NUMBER</label>
                        <input type="text" id="card-number" placeholder="e.g. 1234 5678 9123 0000">
                        <p class="error-message" id="card-number-error"></p>
                    </div>
                    <div class="details">
                        <div class="exp-date">
                            <label for="month">EXP. DATE (MM/YY)</label>
                            <div class="date-inputs">
                                <input type="text" id="month" placeholder="MM">
                                <input type="text" id="year" placeholder="YY">
                            </div>
                            <p class="error-message" id="date-error"></p>
                        </div>
                        <div class="cvc">
                            <label for="cvc-code">CVC</label>
                            <input type="text" id="cvc-code" placeholder="e.g. 123">
                            <p class="error-message" id="cvc-error"></p>
                        </div>
                    </div>
                    <!--Button-->
                    <div class="btn-wrapper">
                        <button id="confirm-btn">Confirm</button>
                    </div>
                </div>
                <!--Thank you page-->
                <div class="thank_you hidden">
                    <img src="styles/images/icon-complete.svg" alt="">
                    <h2>THANK YOU!</h2>
                    <p>We've added your card details</p>
                    <button id="continue-btn">Continue</button>
                </div>
            </div>

        </div>
    </div>
    <script src="main.js"></script>
</body>

</html>
